name: Build rkp_factory_extraction_tool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip ccache

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init AOSP manifest (depth=1)
        run: |
          mkdir -p $GITHUB_WORKSPACE/aosp
          cd $GITHUB_WORKSPACE/aosp
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          repo init -u https://android.googlesource.com/platform/manifest \
            -b android-16.0.0_r1 --depth=1 --partial-clone --clone-filter=blob:limit=10M

      - name: Sync minimal projects
        run: |
          cd $GITHUB_WORKSPACE/aosp
          # 只同步编译 rkp_factory_extraction_tool 所需的最小项目集
          repo sync -c -j8 --no-tags --optimized-fetch --prune \
            platform/system/security \
            platform/system/keymaster \
            platform/system/core \
            platform/system/logging \
            platform/system/libbase \
            platform/system/libcppbor \
            platform/system/tools/aidl \
            platform/build/soong \
            platform/build/make \
            platform/build/blueprint \
            platform/external/protobuf \
            platform/external/boringssl \
            platform/external/gflags \
            platform/external/googletest \
            platform/external/libcxx \
            platform/external/fmtlib \
            platform/external/jsoncpp \
            platform/external/pcre \
            platform/external/zlib \
            platform/prebuilts/clang/host/linux-x86 \
            platform/prebuilts/build-tools \
            platform/prebuilts/go/linux-x86 \
            platform/prebuilts/python/linux-x86 \
            platform/prebuilts/sdk || true

      - name: Attempt build
        run: |
          cd $GITHUB_WORKSPACE/aosp
          source build/envsetup.sh || true
          lunch aosp_arm64-eng || true
          m rkp_factory_extraction_tool 2>&1 | tee $GITHUB_WORKSPACE/build.log || true
          echo "=== Build log tail ==="
          tail -100 $GITHUB_WORKSPACE/build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: $GITHUB_WORKSPACE/build.log

      - name: Upload binary if exists
        if: hashFiles('aosp/out/target/product/generic_arm64/vendor/bin/rkp_factory_extraction_tool') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rkp_factory_extraction_tool
          path: aosp/out/target/product/generic_arm64/vendor/bin/rkp_factory_extraction_tool